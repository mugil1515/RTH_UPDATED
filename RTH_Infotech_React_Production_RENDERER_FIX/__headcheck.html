<!doctype html>
<html><head><meta charset="utf-8"><title>head check</title>
<style>body{margin:0;background:#888;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}canvas{width:100%;display:block}</style>
</head><body>
<script type="module">
import * as THREE from "three";
import { buildAIHumanoidHead } from "/src/components/effects/ai3d/aiHumanoidHead.js";

// Plain-grey anatomy check: every emissive / additive / glass child is stripped
// and replaced with one flat grey standard material, so only the sculpt is left.
const VIEWS = [
  ["front",   [0, 0.0, 3.0]],
  ["3/4",     [1.9, 0.25, 2.3]],
  ["profile", [2.9, 0.05, 0.15]],
  ["low 3/4", [1.7, -0.9, 2.2]],
  ["top 3/4", [1.6, 1.5, 2.1]],
  ["back 3/4",[2.2, 0.4, -1.9]],
  ["close face",[1.1, 0.05, 1.55]],
  ["close prof",[1.75, -0.05, 0.5]],
];

const grey = new THREE.MeshStandardMaterial({ color: 0xb4b4b4, roughness: 0.55, metalness: 0.0 });

for (const [name, cam] of VIEWS) {
  const canvas = document.createElement("canvas");
  canvas.width = 520; canvas.height = 640;
  document.body.appendChild(canvas);
  const r = new THREE.WebGLRenderer({ canvas, antialias: true });
  r.setPixelRatio(2);
  r.setSize(520, 640, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8a8a8a);
  const c = new THREE.PerspectiveCamera(35, 520 / 640, 0.1, 50);

  const head = buildAIHumanoidHead(false);
  const g = head.group;
  g.position.set(0, 0, 0); g.rotation.set(0, 0, 0); g.scale.setScalar(1);

  const kill = [];
  g.traverse((o) => {
    if (o.isPointLight) kill.push(o);
    else if (o.isLineSegments || o.isLine || o.isPoints) kill.push(o);
    else if (o.isMesh || o.isInstancedMesh) {
      const m = o.material;
      // drop the additive glow bits and the glass panel entirely
      if (m && (m.blending === THREE.AdditiveBlending || (m.transmission > 0.7))) kill.push(o);
      else o.material = grey;
    }
  });
  kill.forEach((o) => o.parent && o.parent.remove(o));
  scene.add(g);

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const k = new THREE.DirectionalLight(0xffffff, 2.1); k.position.set(-2.2, 3.0, 3.2); scene.add(k);
  const f = new THREE.DirectionalLight(0xffffff, 0.55); f.position.set(3, -1, 1.5); scene.add(f);
  const b = new THREE.DirectionalLight(0xffffff, 0.7); b.position.set(1, 1, -3); scene.add(b);

  c.position.set(...cam);
  c.lookAt(0, -0.06, 0);
  r.render(scene, c);

  const lab = document.createElement("div");
  lab.textContent = name;
  lab.style.cssText = "position:absolute;color:#000;font:14px monospace";
  document.body.appendChild(lab);
}
window.__ready = true;
</script>
</body></html>

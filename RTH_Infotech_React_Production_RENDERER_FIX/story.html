<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTH — Automation Story (render source)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #f2f0ed; }
      body { display: grid; place-items: center; }
      /* The canvas renders at full output resolution and is only scaled down
         for on-screen preview; the pixels handed to the encoder are native. */
      canvas { max-width: 96vw; max-height: 94vh; box-shadow: 0 24px 70px rgba(60,52,44,.16); }
    </style>
  </head>
  <body>
    <canvas id="out"></canvas>
    <script type="module" src="/src/story/main.js"></script>
  </body>
</html>
